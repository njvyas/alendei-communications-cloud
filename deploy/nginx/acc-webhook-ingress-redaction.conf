#     # Upstream failures are logged at `error` with the raw request line: keep this
#     # location's error log at `crit`. The application logs (redacted) and metrics
#     # still record every ingress failure.
#     error_log  /var/log/nginx/error.log crit;
#     client_max_body_size 64k;   # WEBHOOK_MAX_BODY_BYTES
