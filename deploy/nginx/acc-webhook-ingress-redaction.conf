# =============================================================================
# ACC Phase 5.0 — OD-19: reverse-proxy log redaction for the provider webhook ingress.
#
# The path segment after /webhooks/providers/ IS a provider's ingress key (a bearer
# secret). Phase 5.0 PR-E adds the header form of the same ingress —
# POST /api/v1/webhooks/providers with the key in `X-Acc-Webhook-Ingress-Key` — which this
# location also serves: nginx forwards request headers to the upstream unchanged by default,
# and neither `acc_redacted` nor the error log records request headers, so the header form
# needs no extra redaction. Never add `$http_x_acc_webhook_ingress_key` (or `$http_*` in
# general) to a log_format. nginx's default `combined` access-log format records `$request` — the full
# request line, key included — and nginx's error log records the request line on
# upstream failures. Both must be prevented on the ingress location BEFORE
# DELIVERY_WEBHOOKS_ENABLED is set to true in any environment.
#
# Install (operator, per environment):
#   1. Include the `map` and `log_format` below in the `http {}` context
#      (e.g. /etc/nginx/conf.d/acc-webhook-ingress-redaction.conf).
#   2. Add the `location` block below to the ACC `server {}` block, ABOVE the generic
#      `location /api/` block (regex locations win over prefix locations anyway).
#   3. nginx -t && systemctl reload nginx
#   4. Verify on the host: POST a request to /api/v1/webhooks/providers/<random-test-value>,
#      and one to /api/v1/webhooks/providers with header
#      `X-Acc-Webhook-Ingress-Key: <another-random-test-value>`, and confirm
#      `grep <random-test-value> /var/log/nginx/*.log` finds neither value, while the access
#      log shows /api/v1/webhooks/providers/:providerKey and /api/v1/webhooks/providers.
#      Record the result.
#
# Verified locally against nginx 1.27 by deploy/nginx/verify-webhook-redaction.sh.
# =============================================================================

# --- http {} context ----------------------------------------------------------
# The request URI with the ingress key (and any query string) replaced.
map $request_uri $acc_redacted_request_uri {
    "~^(?<acc_prefix>[^?#]*/webhooks/providers/)[^/?#]*" "${acc_prefix}:providerKey";
    default $request_uri;
}

# `combined`, with the request line rebuilt from the redacted URI (never `$request`).
log_format acc_redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $acc_redacted_request_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# --- server {} context: the ingress location ------------------------------------
