# ACC controlled-MVP release stack (docs/RELEASE.md). Not the development stack:
# that is the repository-root docker-compose.yml.
#
#   ACC_VERSION=<tag> docker compose -f deploy/compose.release.yml --env-file deploy/release.env up -d
#
# Ports: only the API and console are published, and only on the host loopback.
# A TLS reverse proxy on the host terminates HTTPS and forwards to them. PostgreSQL
# and Redis are reachable on the private compose network only, never from outside.
#
# Operator steps (profile `ops`, one-off containers from the API image):
#   docker compose ... run --rm migrate      schema only, history-verified (Task G)
#   docker compose ... run --rm roles        LOGIN/passwords of the four application roles
#   docker compose ... run --rm seed         permission catalogue, platform roles, default reseller
#   docker compose ... run --rm bootstrap    the first platform administrator (idempotent)
#   printf '%s\n' "$PW" | docker compose ... run --rm -T activate-user \
#     --operator <platform admin email> --organization <id|slug> --email <user> --password-stdin
#                                            first password of an invited tenant user (audited)
name: ${ACC_PROJECT:-acc}

x-api: &api
  image: acc-api:${ACC_VERSION:?set ACC_VERSION to the image tag being released}
  env_file: ${ACC_ENV_FILE:-release.env}
  networks: [internal]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acc}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${POSTGRES_DB:-acc}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redis-data:/data]
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *api
    restart: unless-stopped
    ports: ['127.0.0.1:${API_HOST_PORT:-3001}:3001']
    # Longer than SHUTDOWN_TIMEOUT_SECONDS, so the API's own bounded drain decides.
    stop_grace_period: 30s

  web:
    image: acc-web:${ACC_VERSION:?set ACC_VERSION to the image tag being released}
    restart: unless-stopped
    ports: ['127.0.0.1:${WEB_HOST_PORT:-3000}:3000']
    networks: [internal]
    depends_on:
      api: { condition: service_healthy }
    stop_grace_period: 15s

  migrate:
    <<: *api
    profiles: [ops]
    command: ['npm', 'run', 'db:migrate', '--workspace', '@acc/db']

  roles:
    <<: *api
    profiles: [ops]
    command: ['npm', 'run', 'db:roles:reconcile', '--workspace', '@acc/db']

  seed:
    <<: *api
    profiles: [ops]
    command: ['npm', 'run', 'db:seed', '--workspace', '@acc/db']

  bootstrap:
    <<: *api
    profiles: [ops]
    command: ['npm', 'run', 'bootstrap', '--workspace', '@acc/api']

  activate-user:
    <<: *api
    profiles: [ops]
    # Arguments follow `run --rm -T activate-user`; the password arrives on stdin only.
    entrypoint: ['npm', 'run', '--silent', 'user:activate', '--workspace', '@acc/api', '--']
    command: []

networks:
  internal: {}

volumes:
  postgres-data: {}
  redis-data: {}
