global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development

scrape_configs:
  # The API exposes bounded-cardinality metrics on /metrics (OBSERVABILITY.md §3).
  - job_name: acc-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3001']
    honor_labels: false

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
