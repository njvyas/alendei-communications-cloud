# Local development infrastructure for Alendei Communications Cloud.
#
# Scope is deliberately Phase 1 only (DEPLOYMENT.md §2 lists the eventual full
# stack): PostgreSQL, Redis and a Kafka-wire-compatible broker are the Phase 1
# dependencies. OpenSearch, MinIO and the Provider Simulator belong to later
# phases and are intentionally not started here.
#
#   docker compose up -d                      # core stack
#   docker compose --profile observability up -d   # + OTel collector, Prometheus, Grafana
#   docker compose --profile tooling up -d         # + Redpanda Console
name: acc

services:
  postgres:
    image: postgres:17-alpine
    container_name: acc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-acc}
      # Deterministic collation so index/order behaviour matches across machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=500
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-acc}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: acc-redis
    restart: unless-stopped
    # Accelerator only — persistence is deliberately disabled (DATABASE.md §1,
    # SECURITY.md §2: Redis persistence disabled or encrypted at rest).
    command:
      ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    # Kafka-wire-compatible broker (ARCHITECTURE.md §19, DEPLOYMENT.md §2).
    image: redpandadata/redpanda:v24.3.1
    container_name: acc-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - '${KAFKA_EXTERNAL_PORT:-19092}:19092'
      - '${SCHEMA_REGISTRY_PORT:-18081}:18081'
      - '${REDPANDA_ADMIN_PORT:-9644}:9644'
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  redpanda-console:
    image: redpandadata/console:v2.8.5
    container_name: acc-redpanda-console
    profiles: ['tooling']
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - '${REDPANDA_CONSOLE_PORT:-8080}:8080'
    depends_on:
      redpanda:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: acc-otel-collector
    profiles: ['observability']
    restart: unless-stopped
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - '${OTLP_HTTP_PORT:-4318}:4318'
      - '${OTLP_GRPC_PORT:-4317}:4317'
      - '8889:8889'

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: acc-prometheus
    profiles: ['observability']
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=24h'
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'

  grafana:
    image: grafana/grafana:11.4.0
    container_name: acc-grafana
    profiles: ['observability']
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infra/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3002}:3000'
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redpanda-data:
  grafana-data:
